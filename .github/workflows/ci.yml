name: CI

# Compila y corre las pruebas en cada push y pull request (RNF-17).
on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependencias
        run: dotnet restore M8.Notificaciones.sln

      - name: Compilar
        run: dotnet build M8.Notificaciones.sln --no-restore -c Release

      - name: Pruebas
        run: dotnet test M8.Notificaciones.sln --no-build -c Release --verbosity normal
